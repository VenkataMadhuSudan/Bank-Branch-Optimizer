version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_optimizer_app
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_POOLED=${DATABASE_URL_POOLED}
      - SECRET_KEY=${SECRET_KEY:-apexbank-super-secure-production-secret-key-2026-xai}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

